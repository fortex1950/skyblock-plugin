name: Build Plugin Jar

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: List available paper-api versions
        run: |
          curl -s https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml | tr '<' '\n' | grep 'version>' | sed 's/version>//; s#/version##' | tail -30

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyblockPlugin
          path: target/*.jar
